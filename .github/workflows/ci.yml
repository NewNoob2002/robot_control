name: Host CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host build, tests, and static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build ripgrep shellcheck

      - name: Install checksum-verified Hadolint
        env:
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
          HADOLINT_VERSION: v2.12.0
        run: |
          curl --fail --location --show-error --silent \
            --output "${RUNNER_TEMP}/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  ${RUNNER_TEMP}/hadolint" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/hadolint"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Check shell scripts
        run: |
          mapfile -t shell_files < <(
            rg --files -g '*.sh' -g '!out/**' -g '!components/**'
          )
          shellcheck "${shell_files[@]}"

      - name: Check cross image Dockerfile
        # The ARG default is digest-pinned, and the build scripts reject an
        # unpinned override. Hadolint 2.12 cannot infer that external contract.
        run: hadolint --ignore DL3006 docker/cross/Dockerfile

      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            scripts/sysroot/generate_content_manifest.py \
            scripts/sysroot/write_sysroot_lock.py

      - name: Verify CANopen dependency pair
        run: ./scripts/test/test_canopen_dependencies.sh

      - name: Run P5.1 non-SocketCAN host qualification
        run: ./scripts/build/build_p5_1_host.sh

      - name: Run P5.2 Host Release qualification
        run: |
          cmake --preset host-release -S "${GITHUB_WORKSPACE}"
          cmake --build --preset host-release
          ctest --preset host-release --exclude-regex '^socketcan_(socket_lifecycle|vcan_managed)$'

      - name: Run Phase 4 SocketCAN regressions
        run: ctest --preset host-test --tests-regex '^socketcan_(socket_lifecycle|vcan_managed)$'

      - name: Run Phase 1 script regressions
        run: ./scripts/test/test_phase1_scripts.sh

      - name: Run sysroot manifest regressions
        run: ./scripts/test/test_sysroot_manifest.sh
