# key=value 格式；# 开头为注释。分区标题仅为注释，不使用 INI [section] 语法。
# 设备工具和app共用此文件；先停app→设备配置→保存成功→人工重启→app只读校验。

# ==================== 驱动器参数 ====================
# 本区由 robot-control-device-config --apply 写入/保存；app只读，不在退出时恢复。
# keep = 不读写该可选参数、不强制校验期望值，保留厂家/现场原有配置。
# 所有数字均为十进制；驱动器目前固定节点1，CAN为500k的部署配置不由本工具修改。

# 0x6060:00 I8：当前整车profile仅支持3（速度模式）。
drive_mode=3
# 0x200F:00 U16：当前双轮打包目标仅支持1（同步应用，不是CANopen SYNC报文）。
drive_sync=1
# 0x2026:05 U16：每rpm计数，1..10；A写10，不能写0.1。
# 读回不证明倍率生效；保存/重启及0x60FF:03的实际倍率仍需现场验证。
speed_resolution=1
# 0x2008:00 U16，1..1000 rpm或keep；app的max_rpm不得超过明确填写的此值。
# 这是驱动侧上限，与下面app的软件目标上限不同。
drive_max_rpm=100

# 0x6083:01/02 U32，0..32767 ms或keep；是S形加速时间，不是rpm/s。
drive_accel_left_ms=500
drive_accel_right_ms=500
# 0x6084:01/02 U32，0..32767 ms或keep；正常减速时间。
drive_decel_left_ms=500
drive_decel_right_ms=500
# 0x6085:01/02 U32，0..32767 ms或keep；急停减速时间，仅相应停止策略使用。
drive_quick_decel_left_ms=10
drive_quick_decel_right_ms=10
# 0x605A:00 I16：当前控制/停车验收仅支持5（正常减速并保持quick-stop状态）。
# 改6085并不改变605A=5所使用的正常减速时间；不要用此文件切换未经验证的停止策略。
drive_quick_stop=5

# 0x2026:03 U16：低字节INPUT1、高字节INPUT2；各0=锁轴、1=阻尼、2=解轴。
# 十进制值=INPUT1+256*INPUT2；允许0,1,2,256,257,258,512,513,514或keep。
# 与实际急停接线/制动方式共同确认后再设置。
drive_io_stop=keep
# 0x2007:00 U16：0=上电不使能不锁轴，1=不使能锁轴；允许0/1/keep。
drive_start_lock=keep
# 0x2026:04 U16：0=关闭驻车，1=开启；允许0/1/keep。
drive_parking=keep
# 0x2026:07 U16：0=CW、1=CCW；允许0/1/keep。不要与软件左右轮符号重复反转。
drive_direction=keep

# 1=设备工具建立固定app启动PDO基线；0=只核对现有基线，发现不匹配拒绝保存。
# 基线RPDO:6040+6060；状态TPDO:6041+606C:03；诊断TPDO为空。
# app运行时仍临时映射速度RPDO/诊断TPDO，退出恢复基线；不固化运行时映射。
drive_pdo_profile=1
# 保存动作固定为0x2010:00 U16=1，将保存设备全部RW参数，并非仅本区列出的参数。
# 不配置电机极对数、编码器、电流、PID或制动电阻；保留厂家整定值。

# ==================== app应用参数 ====================
# 固定硬件profile；接口须由系统提前配置好，本程序不设置CAN波特率或link-up。
profile=rk3588-zlac8015d-v1
interface=can0
# SBUS串口：100000/8E2；设备配置工具不打开此串口。
device=/dev/ttyACM0
log_dir=./logs
# 软件目标上限1..100 rpm；CH7低/中/高为30%/60%/100%，整数rpm，输出死区1rpm。
max_rpm=5
# 控制周期1..20 ms。
period_ms=10
# 0=持续运行到Ctrl-C/SIGTERM；其余1..3600000 ms。
run_duration_ms=0
# 每个日志文件65536..1073741824字节；每类保留1..20个文件。
log_file_bytes=67108864
log_files=4
